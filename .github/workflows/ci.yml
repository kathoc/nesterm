name: CI

on:
  push:
  pull_request:

jobs:
  test-package:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check:public
      - run: npm test
      - name: Pack and smoke-test the bundled archive
        shell: bash
        run: |
          archive="$(npm pack --silent)"
          prefix="$(mktemp -d)"
          npm install --global --prefix "$prefix" "./$archive"
          "$prefix/bin/nesterm" --help
